scenario:
  name: constrained-capacity
  description: Reduced session availability with elevated cancellation pressure.
  planning_periods: 1
  incremental_sessions_available: 70
  random_seed: 42

capacity:
  default_patients_per_session: 2.8
  default_cancellation_rate: 0.12
  emergency_displacement_rate: 0.08

demand:
  quarterly_growth_rate: 0.02
  uncertainty_standard_deviation: 0.06

policy:
  minimum_sessions_per_eligible_combination: 0
  maximum_share_per_facility: 0.18
  enforce_regional_coverage: true
  minimum_regions_served: 3

simulation:
  iterations: 1000
  patients_per_session_standard_deviation: 0.50
  cancellation_rate_standard_deviation: 0.03
  demand_growth_standard_deviation: 0.04