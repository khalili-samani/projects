name: ASX Equity Intelligence Tests

on:
  push:
    paths:
      - "asx-equity-intelligence-agent/**"
      - ".github/workflows/asx-tests.yml"

  pull_request:
    paths:
      - "asx-equity-intelligence-agent/**"
      - ".github/workflows/asx-tests.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    defaults:
      run:
        working-directory: asx-equity-intelligence-agent

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            asx-equity-intelligence-agent/requirements.txt
            asx-equity-intelligence-agent/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q agents orchestrator.py tests

      - name: Run regression tests
        run: |
          python -m pytest tests -q --cov=agents --cov=orchestrator --cov-report=term-missing